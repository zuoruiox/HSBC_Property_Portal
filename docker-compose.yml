services:
  ml-api:
    build: ./ml-api
    ports:
      - "8000:8000"
    container_name: ml-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  property-estimator:
    build: ./property-estimator
    ports:
      - "8001:8001"
    container_name: property-estimator
    environment:
      - ML_API_URL=http://ml-api:8000
    depends_on:
      ml-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  market-analysis:
    build: ./market-analysis
    ports:
      - "8002:8002"
    container_name: market-analysis
    environment:
      - ml.api.url=http://ml-api:8000
    depends_on:
      ml-api:
        condition: service_healthy
    restart: unless-stopped

  portal:
    build: ./portal
    ports:
      - "3000:3000"
    container_name: portal
    environment:
      - NEXT_PUBLIC_ESTIMATOR_API=http://localhost:8001
      - NEXT_PUBLIC_MARKET_API=http://localhost:8002
      - NEXT_PUBLIC_ML_API=http://localhost:8000
      - SERVER_ESTIMATOR_API=http://property-estimator:8001
      - SERVER_MARKET_API=http://market-analysis:8002
      - SERVER_ML_API=http://ml-api:8000
    depends_on:
      property-estimator:
        condition: service_healthy
      market-analysis:
        condition: service_started
    restart: unless-stopped
